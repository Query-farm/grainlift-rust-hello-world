[package]
name = "grainlift-rust-hello-world"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
description = "Bounded synthetic Grainlift worker for matched ADBC benchmarks"
repository = "https://github.com/Query-farm/grainlift-rust-hello-world"

[dependencies]
adbc_core = { git = "https://github.com/apache/arrow-adbc.git", rev = "616acfdfcea9b66956fdb3d11437b6cf24edbc39" }
arrow-array = "59"
arrow-schema = "59"
axum = "0.7"
clap = { version = "4", features = ["derive"] }
grainlift-server = { git = "https://github.com/Query-farm/grainlift.git", rev = "1a1044f0c3152c1a8350b9c010101a8ad380ef91" }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
vgi-rpc = { version = "0.27.1", features = ["http"] }
