[package]
name = "grainlift-rust-hello-world"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
description = "A minimal ADBC service written in Rust with the Grainlift server library"
repository = "https://github.com/Query-farm/grainlift-rust-hello-world"
publish = false

# Keep this example independent when it is checked out beneath another workspace.
[workspace]

[dependencies]
# Use the same arrow-adbc revision as grainlift-server so the ADBC types match.
adbc_core = { git = "https://github.com/apache/arrow-adbc.git", rev = "c942d481c6e083040c68676e3dd454dad89503e9" }
arrow-array = "60"
arrow-schema = "60"
# CI builds the native ADBC driver from this same grainlift revision.
grainlift-server = { git = "https://github.com/Query-farm/grainlift.git", rev = "50f84f4e55de43ce70f0303a914cb582a262b2a2" }
serde = { version = "1", features = ["derive"] }
# StreamState (serializable producer state) comes from VGI-RPC.
vgi-rpc = { version = "0.28.0", default-features = false, features = ["macros", "stream-codec"] }

[dev-dependencies]
adbc_driver_manager = { git = "https://github.com/apache/arrow-adbc.git", rev = "c942d481c6e083040c68676e3dd454dad89503e9" }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync"] }
