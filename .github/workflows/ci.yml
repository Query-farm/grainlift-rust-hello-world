name: Rust checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  native-conformance:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: grainlift-rust-hello-world
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Query-farm/grainlift
          ref: codex/worker-lifecycle-conformance
          path: grainlift
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.97.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: cargo build --release --locked -p adbc-driver-grainlift
        working-directory: grainlift
      - run: cargo build --release --locked
        working-directory: grainlift-rust-hello-world
      - run: python -m pip install pytest==9.1.1 pyarrow==25.0.1 adbc-driver-manager==1.12.0 cryptography==50.0.1
      - name: Verify HTTP and mTLS through the native ADBC driver
        run: |
          bash validation/diagnostics/make_test_tls.sh "$RUNNER_TEMP/grainlift-rust-tls"
          for transport in http mtls; do
            python -m pytest validation/conformance -q \
              --worker-command '["../grainlift-rust-hello-world/target/release/grainlift-rust-hello-world"]' \
              --native-driver target/release/libadbc_driver_grainlift.so \
              --worker-transport "$transport" \
              --worker-tls-dir "$RUNNER_TEMP/grainlift-rust-tls"
          done
        working-directory: grainlift
